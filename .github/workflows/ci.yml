name: CycloneShield CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Build, Lint, Security & Test Gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: System Diagnostic Doctor
        run: npm run doctor

      - name: Strict Typecheck (Zero Warnings)
        run: npm run lint

      - name: Unit, Property & Security Test Battery
        run: npm run test:coverage

      - name: Production Vite Build
        run: npm run build
